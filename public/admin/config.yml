# Sveltia CMS configuration for javelinaworks.com
# Docs: https://sveltiacms.app/
#
# Mirrors the Astro content collections defined in src/content.config.ts.
# Collections use the English locale folders that content currently lives in
# (src/content/<collection>/english). When we enable additional locales we can
# extend each collection with per-locale folder/files entries.
#
# Note: Sveltia inverts Decap's "required" default — fields without an
# explicit `required:` key are *required* here (Decap treated them as
# optional). Any field intended to be optional must set `required: false`.

backend:
  name: github
  repo: javelina-works/javelina-works.github.io
  # Editors commit to `staging`; the existing staging → main PR flow
  # preserves the review gate we used to get from editorial_workflow.
  branch: staging
  commit_messages:
    create: "content: create {{collection}} '{{slug}}'"
    update: "content: update {{collection}} '{{slug}}'"
    delete: "content: delete {{collection}} '{{slug}}'"
    uploadMedia: "content: upload '{{path}}'"
    deleteMedia: "content: delete '{{path}}'"
    openAuthoring: "{{message}}"

# publish_mode: editorial_workflow
# Disabled: Sveltia hasn't shipped editorial_workflow yet (planned v1.0,
# mid-2026). Until then, saves commit directly to `backend.branch` above.

# Site URL — used for preview links inside the editor.
site_url: https://javelinaworks.com
display_url: https://javelinaworks.com
logo_url: /images/logo.svg

# Media uploads land under public/images/uploads so they're served from
# /images/uploads/* in the built site. Existing hand-curated images under
# public/images/ remain untouched.
media_folder: public/images/uploads
public_folder: /images/uploads

# Shared field definitions are inlined per-collection below. The config
# schema has no top-level "partials", so SEO fields are repeated where they
# apply.

collections:
  # ---------------------------------------------------------------------------
  # Articles
  # ---------------------------------------------------------------------------
  - name: articles
    label: "Articles"
    label_singular: "Article"
    folder: src/content/articles/english
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    preview_path: "articles/{{slug}}"
    # Images for articles live under src/assets/images/articles so Astro optimizes
    # them on build. Sveltia indexes that tree (for thumbnails) and new
    # uploads from article entries land there too.
    media_folder: /src/assets/images/articles
    public_folder: /src/assets/images/articles
    # No filter: editors see drafts and published posts alike. The build step
    # (remove-draft-from-sitemap) strips drafts from the sitemap automatically.
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, required: false }
      - name: author
        label: Author
        widget: relation
        collection: author
        search_fields: [title]
        value_field: title
        display_fields: [title]
        required: false
      - name: categories
        label: Categories
        widget: list
        default: ["others"]
        required: false
      - { name: excerpt, label: Excerpt, widget: text, required: false }
      - { name: image, label: Hero image, widget: image, required: false }
      - { name: featured, label: Featured, widget: boolean, default: false, required: false }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - { name: description, label: Description, widget: text, required: false }
      - { name: keywords, label: SEO keywords, widget: list, required: false }
      - { name: metaTitle, label: Meta title, widget: string, required: false }
      - { name: metaDescription, label: Meta description, widget: text, required: false }
      - { name: canonical, label: Canonical URL, widget: string, required: false }
      - { name: robots, label: Robots directive, widget: string, required: false }
      - { name: excludeFromSitemap, label: Exclude from sitemap, widget: boolean, default: false, required: false }
      - { name: customSlug, label: Custom slug, widget: string, required: false }
      - { name: disableTagline, label: Disable tagline, widget: boolean, default: false, required: false }
      - { name: body, label: Body, widget: markdown }

  # ---------------------------------------------------------------------------
  # Top-level pages (privacy, terms, etc.)
  # ---------------------------------------------------------------------------
  - name: pages
    label: "Pages"
    label_singular: "Page"
    folder: src/content/pages/english
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    preview_path: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, required: false }
      - { name: description, label: Description, widget: text, required: false }
      - { name: image, label: Social/OG image, widget: image, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false, required: false }
      - { name: metaTitle, label: Meta title, widget: string, required: false }
      - { name: metaDescription, label: Meta description, widget: text, required: false }
      - { name: canonical, label: Canonical URL, widget: string, required: false }
      - { name: robots, label: Robots directive, widget: string, required: false }
      - { name: excludeFromSitemap, label: Exclude from sitemap, widget: boolean, default: false, required: false }
      - { name: customSlug, label: Custom slug, widget: string, required: false }
      - { name: keywords, label: SEO keywords, widget: list, required: false }
      - { name: disableTagline, label: Disable tagline, widget: boolean, default: false, required: false }
      - { name: body, label: Body, widget: markdown }

  # ---------------------------------------------------------------------------
  # Services (rendered at /services/ and /services/<slug>/)
  # ---------------------------------------------------------------------------
  - name: services
    label: "Services"
    label_singular: "Service"
    folder: src/content/services/english
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    preview_path: "services/{{slug}}"
    filter: { field: title, pattern: "^(?!What we do).*" }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Page intro, widget: text, required: false }
      - { name: excerpt, label: Card excerpt, widget: text, required: false }
      - { name: icon, label: Lucide icon name, widget: string, required: false, hint: "https://lucide.dev/icons/ (PascalCase, e.g. Crosshair)" }
      - { name: image, label: Hero image, widget: image, required: false }
      - { name: imagePosition, label: Image position, widget: select, options: [left, right], default: left, required: false }
      - { name: imageHeight, label: Image height (px), widget: number, required: false }
      - { name: weight, label: Order, widget: number, required: false }
      - name: highlights
        label: Highlights
        widget: object
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text, required: false }
          - name: list
            label: Items
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
      - name: bento
        label: Image grid under the header
        widget: object
        required: false
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - name: list
            label: Cards
            widget: list
            fields:
              - { name: image, label: Image, widget: image }
              - { name: halfWidth, label: Half width (big card), widget: boolean, default: false, required: false }
              - { name: title, label: Title, widget: string }
              - { name: description, label: One line, widget: text }
      - name: pillars
        label: Why we are different (icon cards)
        widget: object
        required: false
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - name: list
            label: Cards
            widget: list
            fields:
              - { name: icon, label: Lucide icon name, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
      - name: showcases
        label: Cycling showcases (points beside one image)
        widget: list
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text, required: false }
          - { name: imagePosition, label: Image position, widget: select, options: [left, right], default: right, required: false }
          - { name: interval, label: Seconds per point (ms), widget: number, required: false }
          - name: items
            label: Points
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: image, label: Image, widget: image }
      - name: exhibits
        label: Proof blocks (screenshot + points)
        widget: list
        required: false
        fields:
          - { name: image, label: Image, widget: image }
          - { name: imagePosition, label: Image position, widget: select, options: [left, right], default: left, required: false }
          - { name: imageHeight, label: Image height (px), widget: number, required: false }
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text }
          - name: features
            label: Points
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
      - name: steps
        label: Steps (how it goes)
        widget: object
        required: false
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - { name: id, label: Anchor id, widget: string, required: false, hint: "e.g. how-a-job-runs" }
          - { name: layout, label: Layout, widget: select, options: [cards, timeline], default: cards, required: false }
          - name: list
            label: Steps
            widget: list
            fields:
              - { name: step, label: Step label, widget: string, hint: "e.g. Step *01*" }
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - name: button
                label: Link
                widget: object
                required: false
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: url, label: URL, widget: string }
      - name: uses
        label: Standalone uses (icon cards)
        widget: object
        required: false
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - name: list
            label: Cards
            widget: list
            fields:
              - { name: icon, label: Lucide icon name, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
      - name: faq
        label: FAQ
        widget: object
        required: false
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - name: list
            label: Questions
            widget: list
            fields:
              - { name: title, label: Question, widget: string }
              - { name: content, label: Answer, widget: markdown }
              - { name: active, label: Open by default, widget: boolean, default: false, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false, required: false }
      - { name: metaTitle, label: Meta title, widget: string, required: false }
      - { name: metaDescription, label: Meta description, widget: text, required: false }
      - { name: keywords, label: SEO keywords, widget: list, required: false }
      - { name: customSlug, label: Custom slug, widget: string, required: false }
      - { name: body, label: Body, widget: markdown }

  # ---------------------------------------------------------------------------
  # Authors (used by blog posts via the `author` relation)
  # ---------------------------------------------------------------------------
  - name: author
    label: "Authors"
    label_singular: "Author"
    folder: src/content/author/english
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    media_folder: /src/assets/images/author
    public_folder: /src/assets/images/author
    fields:
      - { name: title, label: Name, widget: string }
      - { name: role, label: Role, widget: string, required: false }
      - { name: image, label: Portrait, widget: image, required: false }
      - { name: body, label: Bio, widget: markdown, required: false }

  # ---------------------------------------------------------------------------
  # Careers / open jobs
  # ---------------------------------------------------------------------------
  - name: career
    label: "Careers"
    label_singular: "Job"
    folder: src/content/career/english
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - { name: title, label: Title, widget: string }
      - { name: draft, label: Draft, widget: boolean, default: true, required: false }
      - { name: excerpt, label: Excerpt, widget: text, required: false }
      - { name: customSlug, label: Custom slug, widget: string, required: false }
      - name: fields
        label: Job details
        widget: list
        required: false
        summary: "{{fields.name}}: {{fields.content}}"
        fields:
          - { name: name, label: Label, widget: string }
          - { name: content, label: Value, widget: string }
      - name: button
        label: Apply button
        widget: object
        required: false
        fields:
          - { name: enable, label: Enable, widget: boolean, default: true }
          - { name: label, label: Button label, widget: string, default: "Apply Now" }
          - { name: url, label: Apply URL, widget: string }
          - { name: rel, label: rel, widget: string, required: false }
          - { name: target, label: target, widget: string, required: false }
          - name: hoverEffect
            label: Hover effect
            widget: select
            required: false
            options:
              - text-flip
              - creative-fill
              - magnetic
              - magnetic-text-flip
      - { name: body, label: Description, widget: markdown }

  # ---------------------------------------------------------------------------
  # Sections — reusable homepage/landing-page content blocks
  # ---------------------------------------------------------------------------
  - name: sections
    label: "Sections"
    label_singular: "Section"
    folder: src/content/sections/english
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    # Sections reference images across several subtrees of src/assets/images
    # (homepage/, office/, etc.), so the media root is the whole tree.
    media_folder: /src/assets/images
    public_folder: /src/assets/images
    # Section frontmatter varies widely by section type, so the editor gets a
    # free-form "extra frontmatter" object. Swap to typed fields per section
    # once we lock down the shapes.
    fields:
      - { name: title, label: Title, widget: string, required: false }
      - { name: description, label: Description, widget: text, required: false }
      - { name: image, label: Image, widget: image, required: false }
      - { name: body, label: Body, widget: markdown, required: false }

  # ---------------------------------------------------------------------------
  # Testimonials
  # ---------------------------------------------------------------------------
  - name: testimonial
    label: "Testimonials"
    label_singular: "Testimonial"
    folder: src/content/testimonial/english
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - { name: title, label: Title, widget: string, required: false }
      - { name: body, label: Body, widget: markdown, required: false }

  # ---------------------------------------------------------------------------
  # FAQ entries
  # ---------------------------------------------------------------------------
  - name: faq
    label: "FAQ"
    label_singular: "FAQ entry"
    folder: src/content/faq/english
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - { name: title, label: Question, widget: string }
      - { name: body, label: Answer, widget: markdown }

  # ---------------------------------------------------------------------------
  # Pricing content
  # ---------------------------------------------------------------------------
  - name: pricing
    label: "Pricing"
    label_singular: "Pricing entry"
    folder: src/content/pricing/english
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - { name: title, label: Title, widget: string, required: false }
      - { name: body, label: Body, widget: markdown, required: false }

  # ---------------------------------------------------------------------------
  # Contact page content
  # ---------------------------------------------------------------------------
  - name: contact
    label: "Contact"
    label_singular: "Contact entry"
    folder: src/content/contact/english
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - { name: title, label: Title, widget: string, required: false }
      - { name: body, label: Body, widget: markdown, required: false }

  # ---------------------------------------------------------------------------
  # Site singletons — homepage intro, blog landing, changelog landing
  # ---------------------------------------------------------------------------
  - name: site
    label: "Site content"
    editor:
      preview: false
    files:
      - name: homepage
        label: "Homepage"
        file: src/content/homepage/english/-index.md
        format: frontmatter
        extension: md
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - { name: description, label: Description, widget: text, required: false }
          - { name: metaTitle, label: Meta title, widget: string, required: false }
          - { name: metaDescription, label: Meta description, widget: text, required: false }
          - { name: draft, label: Draft, widget: boolean, default: false, required: false }
          - { name: disableTagline, label: Disable tagline, widget: boolean, default: false, required: false }
          - { name: body, label: Body, widget: markdown, required: false }

      - name: blog_index
        label: "Blog landing"
        file: src/content/blog/english/-index.md
        format: frontmatter
        extension: md
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - { name: description, label: Description, widget: text, required: false }
          - { name: metaTitle, label: Meta title, widget: string, required: false }
          - { name: metaDescription, label: Meta description, widget: text, required: false }
          - { name: draft, label: Draft, widget: boolean, default: false, required: false }
          - { name: body, label: Body, widget: markdown, required: false }
