<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Listbox</title></head>
<body>
<!-- Plain HTML. The words are the address lookup's test places (the e2e fixtures); the second option is highlighted. -->
<div class="jw-demo" style="max-width: 480px">
  <div class="jw-field">
    <label class="jw-field__label" for="lb-addr">Ranch address</label>
    <input class="jw-input" id="lb-addr" type="text" value="03 Ranch Road" aria-controls="lb-list" aria-autocomplete="list">
  </div>
  <div class="jw-listbox" id="lb-list" role="listbox" aria-label="Address suggestions">
    <button type="button" class="jw-listbox__option" role="option" aria-selected="false"><span>03 Ranch Road</span><small>Davie, Florida 33326, United States</small></button>
    <button type="button" class="jw-listbox__option" role="option" aria-selected="true"><span>03 Ranch Road</span><small>Fort Davis, Texas 79734, United States</small></button>
    <button type="button" class="jw-listbox__option" role="option" aria-selected="false" style="background: var(--surface-sunken)"><span>Rancho Drive</span><small>Escondido, California 92029</small></button>
  </div>
  <p class="jw-caption" style="margin-top: 12px">The second option is highlighted (arrow keys); the third is shown on hover.</p>
</div>
</body>
</html>
