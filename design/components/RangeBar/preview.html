<!-- @dsCard group="Data" height=260 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Range bar</title></head>
<body>
<!-- Plain HTML. Example figures (the design system's 212 ac), not site data. -->
<div class="jw-demo" style="max-width: 520px; gap: 32px">
  <div class="jw-range" style="--jw-lo: 30%; --jw-hi: 80%; --jw-at: 50.67%">
    <div class="jw-range__track" role="img" aria-label="180 ac to 240 ac"><span class="jw-range__band"></span><span class="jw-range__marker"></span></div>
    <div class="jw-range__ends">
      <p class="jw-range__end"><span class="jw-range__end-label">Low</span><span class="jw-range__end-value">180 ac</span></p>
      <p class="jw-range__end"><span class="jw-range__end-label">High</span><span class="jw-range__end-value">240 ac</span></p>
    </div>
  </div>
  <div class="jw-range" style="--jw-lo: 12%; --jw-hi: 46%">
    <div class="jw-range__track" role="img" aria-label="1–2 weeks to 2–4 weeks"><span class="jw-range__band"></span></div>
    <div class="jw-range__ends">
      <p class="jw-range__end"><span class="jw-range__end-value">1–2 weeks</span></p>
      <p class="jw-range__end"><span class="jw-range__end-value">2–4 weeks</span></p>
    </div>
  </div>
</div>
</body>
</html>
