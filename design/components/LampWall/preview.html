<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Lamp wall</title></head>
<body>
<div id="root" class="jw-demo"></div>
<script>
var J = window.JavelinaWorks, h = React.createElement;
function Row(p) { return h('div', { className: 'jw-row', style: p.style }, p.children); }
var NAMES = { flake: 'Flaky rust', corrugated: 'Corrugated tin', smooth: 'Smooth rust' };
function Demo() {
  var s = React.useState('flake'), t = s[0], setT = s[1];
  return h(J.LightScene, null,
    h(Row, { style: { marginBottom: 4 } }, ['flake', 'corrugated', 'smooth'].map(function (k) { return h(J.Button, { key: k, variant: t === k ? 'shell' : 'quiet', size: 'sm', onClick: function () { setT(k); } }, NAMES[k]); })),
    h(J.LampWall, { key: t, texture: t, style: { height: 330, borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center' } },
      h(J.Button, { lamp: true, href: '#ballpark' }, 'Get a ballpark')),
    h('span', { className: 'jw-caption' }, 'At night the lamp lights the wall; by day the sun does, and the lamp only shows on hover.'));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
