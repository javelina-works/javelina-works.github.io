<!-- @dsCard group="Forms" height=330 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Radio group</title></head>
<body>
<!-- Plain HTML. The labels are the brush return calculator's. -->
<div class="jw-demo" style="max-width: 520px">
  <fieldset class="jw-radios">
    <legend class="jw-radios__legend">Main brush</legend>
    <div class="jw-radios__list">
      <label class="jw-check jw-radio"><input type="radio" class="jw-radio__dot" name="pv-brush" value="mesquite" checked><span class="jw-check__text">Mesquite</span></label>
      <label class="jw-check jw-radio"><input type="radio" class="jw-radio__dot" name="pv-brush" value="juniper"><span class="jw-check__text">Cedar / juniper</span></label>
      <label class="jw-check jw-radio"><input type="radio" class="jw-radio__dot" name="pv-brush" value="mixed"><span class="jw-check__text">Mixed</span></label>
    </div>
  </fieldset>
  <fieldset class="jw-radios jw-radios--inline">
    <legend class="jw-radios__legend">Ground underneath</legend>
    <div class="jw-radios__list">
      <label class="jw-check jw-radio"><input type="radio" class="jw-radio__dot" name="pv-ground" value="upland" checked><span class="jw-check__text">Upland</span></label>
      <label class="jw-check jw-radio"><input type="radio" class="jw-radio__dot" name="pv-ground" value="karst"><span class="jw-check__text">Fractured rock, springs</span></label>
      <label class="jw-check jw-radio"><input type="radio" class="jw-radio__dot" name="pv-ground" value="draw" disabled><span class="jw-check__text">Draw or creek</span></label>
    </div>
  </fieldset>
</div>
</body>
</html>
