<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Figure</title></head>
<body>
<div class="jw-demo">
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
    <figure class="jw-figure">
      <div class="jw-figure__media"><img src="/assets/images/survey-detections.jpg" alt="Survey image of a pasture with each woody plant boxed" width="1600" height="864" loading="lazy" decoding="async"></div>
      <figcaption class="jw-figure__caption">A photo dims a little at night.</figcaption>
    </figure>
    <figure class="jw-figure jw-figure--nodim jw-figure--crop">
      <div class="jw-figure__media" style="aspect-ratio: 16 / 9"><img src="/assets/images/survey-detections.jpg" alt="The same survey image, cropped" width="1600" height="864" loading="lazy" decoding="async"></div>
      <figcaption class="jw-figure__caption">A map or diagram keeps its colors (jw-figure--nodim), here cropped to 16:9.</figcaption>
    </figure>
  </div>
</div>
</body>
</html>
