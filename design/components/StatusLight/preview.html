<head><meta charset="utf-8"><title>Status light</title></head>

  h(J.LampWall, { texture: 'smooth', seed: 9, style: { height: 190, borderRadius: 8, display: 'flex', alignItems: 'flex-end', padding: 24, boxSizing: 'border-box' } },
    h(J.StatusLight, { label: 'Taking new surveys' }))
