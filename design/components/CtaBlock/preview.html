<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Call to action</title></head>
<body>
<section class="jw-wall jw-wall--smooth jw-wall--static jw-section call-to-action" data-jw-wall="smooth" data-jw-seed="9" aria-labelledby="pv-cta-title">
  <canvas class="jw-wall__canvas" aria-hidden="true"></canvas>
  <div class="jw-container">
    <div class="jw-ask__frame">
      <div class="jw-lit" data-jw-shadow>
        <span class="jw-cast" aria-hidden="true"></span><span class="jw-cast" aria-hidden="true"></span>
        <div class="jw-surface jw-surface--card jw-ask">
          <h2 class="t-heading-1 jw-ask__title" id="pv-cta-title">Tell us about your place</h2>
          <div class="jw-ask__text"><p>A call costs nothing, and nothing is owed until you have seen the plan and signed it.</p><p>Or start with the free ballpark and have a budget range in about a minute.</p></div>
          <div class="jw-ask__actions">
            <a class="jw-btn jw-btn--burnt" href="#contact" data-cta><span class="jw-btn__mark" aria-hidden="true"></span>Let's Talk</a>
            <a class="jw-btn jw-btn--ghost" href="#ballpark" data-cta>Get a ballpark</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<script>window.JavelinaWorks.Lighting.mount();</script>
</body>
</html>
