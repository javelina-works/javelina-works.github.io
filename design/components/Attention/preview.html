<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Attention</title></head>
<body>
<div id="root" class="jw-demo"></div>
<script>
var J = window.JavelinaWorks, h = React.createElement;
function Row(p) { return h('div', { className: 'jw-row', style: p.style }, p.children); }
function Demo() {
  var s = React.useState(0), k = s[0], setK = s[1];
  return h(React.Fragment, null,
    h(Row, { style: { gap: 32, paddingLeft: 12 } }, h(J.Button, { key: 'f' + k, attention: 'flicker' }, 'Flicker on'), h(J.Button, { attention: 'glint' }, 'Glint'), h(J.Button, { attention: 'breathe' }, 'Breathe')),
    h(Row, null, h(J.Button, { variant: 'quiet', size: 'sm', onClick: function () { setK(k + 1); } }, 'Replay the demo'), h('span', { className: 'jw-caption' }, 'On a page the flicker plays once, when the button comes into view. Breathe only shows at night.')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
