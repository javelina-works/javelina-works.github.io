<!-- @dsCard group="Forms" height=360 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Stepper</title></head>
<body>
<!-- Plain HTML. The words are the ballpark's three steps. Each row is one moment of the flow. -->
<div class="jw-demo" style="max-width: 560px; display: flex; flex-direction: column; gap: 24px">
  <p class="jw-caption">At the start: step 1 is current, the others can't be reached yet</p>
  <ol class="jw-steps" aria-label="Progress">
    <li><button type="button" class="jw-steps__step" aria-current="step" disabled><span class="jw-steps__n">1</span><span class="jw-steps__label">Find your ranch</span></button></li>
    <li><button type="button" class="jw-steps__step" disabled><span class="jw-steps__n">2</span><span class="jw-steps__label">Analysis</span></button></li>
    <li><button type="button" class="jw-steps__step" disabled><span class="jw-steps__n">3</span><span class="jw-steps__label">Get ballpark</span></button></li>
  </ol>
  <p class="jw-caption">On the result: steps 1 and 2 are done and can be pressed to go back</p>
  <ol class="jw-steps" aria-label="Progress">
    <li><button type="button" class="jw-steps__step is-done"><span class="jw-steps__n">&#10003;</span><span class="jw-steps__label">Find your ranch</span></button></li>
    <li><button type="button" class="jw-steps__step is-done"><span class="jw-steps__n">&#10003;</span><span class="jw-steps__label">Analysis</span></button></li>
    <li><button type="button" class="jw-steps__step" aria-current="step" disabled><span class="jw-steps__n">3</span><span class="jw-steps__label">Get ballpark</span></button></li>
  </ol>
  <p class="jw-caption">Hover on a step that can be pressed</p>
  <ol class="jw-steps" aria-label="Progress">
    <li><button type="button" class="jw-steps__step is-done"><span class="jw-steps__n">&#10003;</span><span class="jw-steps__label">Find your ranch</span></button></li>
    <li><button type="button" class="jw-steps__step" aria-current="step" disabled><span class="jw-steps__n">2</span><span class="jw-steps__label">Analysis</span></button></li>
    <li><button type="button" class="jw-steps__step"><span class="jw-steps__n">3</span><span class="jw-steps__label">Get ballpark</span></button></li>
  </ol>
</div>
</body>
</html>
