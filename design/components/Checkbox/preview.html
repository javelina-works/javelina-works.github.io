<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkbox</title></head>
<body>
<div class="jw-demo" style="max-width: 520px">
  <fieldset style="margin: 0; padding: 0; border: 0">
    <label class="jw-check"><input type="checkbox" class="jw-check__box" checked disabled><span class="jw-check__text"><strong>Essential</strong> — keeps the site working and protects the estimate tools from abuse. Always on.</span></label>
    <label class="jw-check"><input type="checkbox" class="jw-check__box" checked><span class="jw-check__text"><strong>Analytics</strong> — which pages and tools get used, so we can improve them.</span></label>
    <label class="jw-check"><input type="checkbox" class="jw-check__box"><span class="jw-check__text"><strong>Session recordings</strong> — a replay of your visit, so we can see what broke and fix it.</span></label>
    <label class="jw-check"><input type="checkbox" class="jw-check__box" required><span class="jw-check__text">I agree with <a href="#privacy-policy">privacy policy</a></span></label>
  </fieldset>
</div>
</body>
</html>
