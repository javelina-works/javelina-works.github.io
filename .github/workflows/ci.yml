name: CI

on:
  # For now, we are going to hold back on these checks entirely until further solved
  # pull_request:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # - name: Prettier check
      #   run: pnpm run format:check

      - name: Astro check
        run: pnpm run astro-check

      - name: Build
        run: pnpm run build

      # - name: Jest
      #   run: pnpm run test:ci
