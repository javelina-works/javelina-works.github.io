name: Playwright Smoke (preview)

# Runs when Netlify finishes deploying a preview. Netlify reports previews as
# a commit status (context netlify/javelina-works/deploy-preview), not as a
# GitHub deployment, so this listens for that status. Note: GitHub runs
# status-triggered workflows from the default branch's copy of this file.
on:
  status:

# Default to read-only; only the comment job, which never checks out or runs
# preview code, can write to pull requests.
permissions:
  contents: read

jobs:
  smoke:
    name: Playwright smoke (preview)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.smoke.outcome }}
    # Preview URLs only — skip production and any failed/in-progress states.
    if: |
      github.event.context == 'netlify/javelina-works/deploy-preview' &&
      github.event.state == 'success' &&
      startsWith(github.event.target_url, 'https://deploy-preview-')
    env:
      PREVIEW_URL: ${{ github.event.target_url }}
    steps:
      # The preview commit's code runs below (install, tests), so the token
      # must not be left in its git config.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        id: smoke
        run: pnpm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  comment:
    name: Report smoke result on the PR
    needs: smoke
    if: always() && needs.smoke.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW_URL: ${{ github.event.target_url }}
    steps:
      - name: Find PR for this deployment
        id: find-pr
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha }}
        run: |
          set -euo pipefail
          NUMBER=$(gh api "repos/${{ github.repository }}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.state == "open")] | .[0].number // empty')
          if [ -z "$NUMBER" ]; then
            echo "No open PR found for ${SHA} — skipping comment"
          else
            echo "Found PR #${NUMBER} for ${SHA}"
          fi
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build PR comment
        if: always() && steps.find-pr.outputs.number != ''
        env:
          OUTCOME: ${{ needs.smoke.outputs.outcome }}
          TARGET_URL: ${{ env.PREVIEW_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            STATUS="✅ passed"
          else
            STATUS="❌ failed"
          fi
          {
            echo "## Playwright smoke — [preview](${TARGET_URL})"
            echo ""
            echo "**Status:** ${STATUS}"
            echo ""
            echo "<sub>[full report](${RUN_URL}) · artifact: \`playwright-report\`</sub>"
          } > comment.md

      - name: Comment Playwright result on PR
        if: always() && steps.find-pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.find-pr.outputs.number }}
          header: playwright-preview
          path: comment.md

      - name: Fail job if smoke failed
        if: needs.smoke.outputs.outcome != 'success'
        run: exit 1
