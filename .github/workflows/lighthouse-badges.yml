name: Lighthouse Badges

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

env:
  TARGET_URL: "https://javelinaworks.com"
  LHCI_RUNS: 3

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Lighthouse
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ env.TARGET_URL }}
          runs: ${{ env.LHCI_RUNS }}
          uploadArtifacts: false

      - name: Extract scores
        id: scores
        run: |
          MANIFEST='${{ steps.lhci.outputs.manifest }}'
          PERF=$(echo "$MANIFEST" | jq -r '.[0].summary.performance // empty')
          A11Y=$(echo "$MANIFEST" | jq -r '.[0].summary.accessibility // empty')
          BP=$(echo "$MANIFEST" | jq -r '.[0].summary."best-practices" // empty')
          SEO=$(echo "$MANIFEST" | jq -r '.[0].summary.seo // empty')

          score_and_color() {
            local raw="$1"
            if [ -z "$raw" ] || [ "$raw" = "null" ]; then
              echo "n/a lightgrey"
              return
            fi
            local score=$(awk "BEGIN {printf \"%d\", $raw * 100}")
            local color="red"
            if [ "$score" -ge 90 ]; then color="brightgreen"
            elif [ "$score" -ge 50 ]; then color="orange"
            fi
            echo "$score $color"
          }

          read PERF_SCORE PERF_COLOR <<< $(score_and_color "$PERF")
          read A11Y_SCORE A11Y_COLOR <<< $(score_and_color "$A11Y")
          read BP_SCORE BP_COLOR <<< $(score_and_color "$BP")
          read SEO_SCORE SEO_COLOR <<< $(score_and_color "$SEO")

          {
            echo "perf-score=$PERF_SCORE"
            echo "perf-color=$PERF_COLOR"
            echo "a11y-score=$A11Y_SCORE"
            echo "a11y-color=$A11Y_COLOR"
            echo "bp-score=$BP_SCORE"
            echo "bp-color=$BP_COLOR"
            echo "seo-score=$SEO_SCORE"
            echo "seo-color=$SEO_COLOR"
          } >> "$GITHUB_OUTPUT"

      - name: Update Performance badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: lighthouse-performance.json
          label: Performance
          message: ${{ steps.scores.outputs.perf-score }}
          color: ${{ steps.scores.outputs.perf-color }}
          namedLogo: lighthouse
          logoColor: white

      - name: Update Accessibility badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: lighthouse-accessibility.json
          label: Accessibility
          message: ${{ steps.scores.outputs.a11y-score }}
          color: ${{ steps.scores.outputs.a11y-color }}
          namedLogo: lighthouse
          logoColor: white

      - name: Update Best Practices badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: lighthouse-best-practices.json
          label: Best Practices
          message: ${{ steps.scores.outputs.bp-score }}
          color: ${{ steps.scores.outputs.bp-color }}
          namedLogo: lighthouse
          logoColor: white

      - name: Update SEO badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: lighthouse-seo.json
          label: SEO
          message: ${{ steps.scores.outputs.seo-score }}
          color: ${{ steps.scores.outputs.seo-color }}
          namedLogo: lighthouse
          logoColor: white

      - name: Summarize Lighthouse run
        if: always()
        run: |
          set -euo pipefail
          MANIFEST=".lighthouseci/manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "No LHCI manifest found — skipping summary"
            exit 0
          fi

          REPORT=$(jq -r '(map(select(.isRepresentativeRun)) | .[0] // .[0]).jsonPath' "$MANIFEST")
          if [ ! -f "$REPORT" ]; then
            echo "No LHR report at $REPORT — skipping summary"
            exit 0
          fi

          TARGET=$(jq -r '.requestedUrl // .finalUrl' "$REPORT")
          FETCHED=$(jq -r '.fetchTime' "$REPORT")

          metric() {
            jq -r --arg id "$1" '.audits[$id].displayValue // "n/a"' "$REPORT"
          }

          {
            echo "## Lighthouse Audit — $TARGET"
            echo ""
            echo "_Representative run of ${LHCI_RUNS} — captured ${FETCHED}_"
            echo ""
            echo "### Core Web Vitals"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Largest Contentful Paint | $(metric largest-contentful-paint) |"
            echo "| First Contentful Paint | $(metric first-contentful-paint) |"
            echo "| Total Blocking Time | $(metric total-blocking-time) |"
            echo "| Cumulative Layout Shift | $(metric cumulative-layout-shift) |"
            echo "| Speed Index | $(metric speed-index) |"
            echo "| Time to Interactive | $(metric interactive) |"
            echo "| Server Response Time | $(metric server-response-time) |"
            echo ""
            echo "### LCP Element"
            echo ""
            jq -r '
              .audits."largest-contentful-paint-element".details.items[0].items // []
              | map("- `" + (.node.selector // "(unknown)") + "` — " + ((.node.nodeLabel // "") | gsub("\n"; " ")))
              | if length == 0 then ["_No LCP element captured._"] else . end
              | .[]
            ' "$REPORT"
            echo ""
            echo "### Top Performance Opportunities"
            echo ""
            jq -r '
              .audits
              | to_entries
              | map(select(.value.details.type == "opportunity" and (.value.numericValue // 0) > 0))
              | sort_by(-(.value.numericValue // 0))
              | .[:5]
              | map("- **" + .value.title + "** — est. savings " + ((.value.numericValue // 0) | tostring) + " ms" + (if .value.displayValue then " (" + .value.displayValue + ")" else "" end))
              | if length == 0 then ["_No significant opportunities flagged._"] else . end
              | .[]
            ' "$REPORT"
            echo ""
            echo "### Failing Diagnostics"
            echo ""
            jq -r '
              .audits
              | to_entries
              | map(select((.value.score // 1) < 0.9 and .value.scoreDisplayMode != "notApplicable" and .value.scoreDisplayMode != "informative" and .value.details.type != "opportunity"))
              | sort_by(.value.score // 1)
              | .[:6]
              | map("- **" + .value.title + "**" + (if .value.displayValue then " — " + .value.displayValue else "" end))
              | if length == 0 then ["_All diagnostics passing._"] else . end
              | .[]
            ' "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Notify on failure
    needs: [lighthouse]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Discord monitoring channel
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_MONITORING_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_MONITORING_WEBHOOK_URL is not set — skipping"
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          jq -n \
            --arg title "CI failed: $WORKFLOW" \
            --arg desc "[Run #$RUN_NUMBER]($RUN_URL) on \`$BRANCH\` @ \`$SHORT_SHA\`" \
            '{embeds:[{title:$title, description:$desc, color:15158332}]}' \
          | curl -sSf -H "Content-Type: application/json" -X POST --data-binary @- "$WEBHOOK_URL"
