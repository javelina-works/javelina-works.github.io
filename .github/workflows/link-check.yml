name: Link Check

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    name: Check links in built site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      # Same-site links resolve against the build output, not the live site.
      # Fetching every /_astro image from production in one burst caused
      # false "connection failed" / 520 errors.
      # nrcs.usda.gov resets HTTP/2 streams for lychee's client, but the same
      # URL returns 200 to curl.
      - name: Link check
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir ${{ github.workspace }}/dist
            --index-files index.html
            --cache
            --max-cache-age 1d
            --no-progress
            --max-concurrency 16
            --max-retries 5
            --retry-wait-time 5
            --accept 200,204,206,301,302,308,403,429
            --exclude '^https://www\.nrcs\.usda\.gov/'
            --exclude-path 'dist/_astro'
            './dist/**/*.html'
          fail: false
          output: ./lychee-report.md

      - name: Find existing issue
        id: find-issue
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links',
            });
            return issues[0]?.number ?? '';
          result-encoding: string

      - name: Open or update issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Broken links detected on the site"
          content-filepath: ./lychee-report.md
          issue-number: ${{ steps.find-issue.outputs.result }}
          labels: broken-links, automated
