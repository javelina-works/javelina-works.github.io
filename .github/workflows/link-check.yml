name: Link Check

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    name: Check links in built site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link check
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --base https://javelinaworks.com
            --cache
            --max-cache-age 1d
            --no-progress
            --accept 200,204,206,301,302,308,403,429
            --exclude-path 'dist/_astro'
            './dist/**/*.html'
          fail: false
          output: ./lychee-report.md

      - name: Find existing issue
        id: find-issue
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links',
            });
            return issues[0]?.number ?? '';
          result-encoding: string

      - name: Open or update issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Broken links detected on the site"
          content-filepath: ./lychee-report.md
          issue-number: ${{ steps.find-issue.outputs.result }}
          labels: broken-links, automated
