[functions]
  directory = "netlify/functions"

[build]
  publish = "dist"
  command = "pnpm build"

  [build.environment]
    NODE_VERSION = "22"

# Lighthouse runs in GitHub Actions instead — see
# .github/workflows/lighthouse-preview.yml (per-preview, warn-only) and
# .github/workflows/lighthouse-badges.yml (production, daily).
# The @netlify/plugin-lighthouse plugin was removed because it silently
# swallowed runtime errors and never actually enforced its thresholds.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sveltia CMS admin. The config.yml is hand-edited in this repo, so never
# cache it — editors need their changes visible on the next reload.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

# PostHog reverse proxy — routes /ingest/* through our own origin so ad
# blockers targeting *.posthog.com don't drop events or block the JS bundle.
# Order matters: the /static/* rule must come before the catch-all.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true
