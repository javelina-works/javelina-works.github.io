[functions]
  directory = "netlify/functions"

[build]
  publish = "dist"
  command = "pnpm build"

  [build.environment]
    NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

  # optional, deploy the lighthouse report to a path under your site
  [plugins.inputs.audits]
    output_path = "reports/lighthouse.html"

  # Optional: fail the deploy if scores fall below thresholds
  [plugins.inputs.thresholds]
    performance = 0.9 # Until we figure our the performance issue
    accessibility = 0.9
    best-practices = 0.9
    seo = 0.9

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PostHog reverse proxy — routes /ingest/* through our own origin so ad
# blockers targeting *.posthog.com don't drop events or block the JS bundle.
# Order matters: the /static/* rule must come before the catch-all.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true
